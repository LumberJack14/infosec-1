name: CI

# Проверки запускаются при каждом push и при создании pull request.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest bandit pip-audit

      - name: Run tests
        run: pytest -v

      # SAST: статический анализатор кода на уязвимости.
      - name: SAST - Bandit
        run: bandit -r src -ll

      # SCA: проверка зависимостей на известные уязвимости (CVE).
      - name: SCA - pip-audit
        run: pip-audit -r requirements.txt
